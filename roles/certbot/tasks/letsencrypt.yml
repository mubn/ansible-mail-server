---
- name: Install certbot
  ansible.builtin.apt:
    name: certbot
    state: present

- name: Create Let's Encrypt renew-hook directory
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/post
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy certificate renew hook
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/post/reload-mail.sh
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/sh
      systemctl reload dovecot.service 2>/dev/null || true
      systemctl reload postfix.service 2>/dev/null || true

- name: Enable certbot renew timer
  ansible.builtin.service:
    name: certbot.timer
    state: started
    enabled: true

- name: Request Let's Encrypt certificates
  ansible.builtin.command:
    argv:
      - certbot
      - certonly
      - --standalone
      - --non-interactive
      - --agree-tos
      - --rsa-key-size
      - "{{ mail_tls_key_size }}"
      - -m
      - "{{ mail_admin_email }}"
      - -d
      - "{{ mail_fqdn }}"
      - -d
      - "{{ mail_imap_fqdn }}"
      - -d
      - "{{ mail_smtp_fqdn }}"
    creates: "{{ mail_tls_cert_path }}"
