---
- name: Install MariaDB and Python connector
  ansible.builtin.apt:
    name: "{{ mail_mysql_packages }}"
    state: present

- name: Enable and start MariaDB
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

- name: Create vmail database
  community.mysql.mysql_db:
    name: "{{ mail_db_name }}"
    encoding: utf8
    state: present
    login_unix_socket: "{{ mail_mysql_socket }}"

- name: Create vmail database user
  community.mysql.mysql_user:
    name: "{{ mail_db_user }}"
    password: "{{ mail_db_password }}"
    host: localhost
    priv: "{{ mail_db_name }}.*:SELECT"
    state: present
    login_unix_socket: "{{ mail_mysql_socket }}"
  no_log: true

- name: Deploy vmail schema
  ansible.builtin.copy:
    src: schema.sql
    dest: /etc/mysql/vmail-schema.sql
    owner: root
    group: root
    mode: "0600"
  register: mail_schema_file

- name: Import vmail schema
  community.mysql.mysql_db:
    name: "{{ mail_db_name }}"
    state: import
    target: /etc/mysql/vmail-schema.sql
    login_unix_socket: "{{ mail_mysql_socket }}"
  when: mail_schema_file is changed

- name: Deploy initial mailbox data
  ansible.builtin.template:
    src: bootstrap.sql.j2
    dest: /etc/mysql/vmail-bootstrap.sql
    owner: root
    group: root
    mode: "0600"
  register: mail_bootstrap_file
  no_log: true

- name: Import initial mailbox data
  community.mysql.mysql_db:
    name: "{{ mail_db_name }}"
    state: import
    target: /etc/mysql/vmail-bootstrap.sql
    login_unix_socket: "{{ mail_mysql_socket }}"
  when: mail_bootstrap_file is changed
  no_log: true
