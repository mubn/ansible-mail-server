---
- name: Ensure APT keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Rspamd repository signing key
  ansible.builtin.get_url:
    url: https://rspamd.com/apt-stable/gpg.key
    dest: /etc/apt/keyrings/rspamd.asc
    owner: root
    group: root
    mode: "0644"

- name: Dearmor Rspamd repository signing key
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --yes
      - --dearmor
      - --output
      - /etc/apt/keyrings/rspamd.gpg
      - /etc/apt/keyrings/rspamd.asc
    creates: /etc/apt/keyrings/rspamd.gpg

- name: Add Rspamd APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/rspamd.gpg]
      http://rspamd.com/apt-stable/
      {{ ansible_facts['distribution_release'] }} main
    filename: rspamd
    state: present
    update_cache: true

- name: Install Rspamd and Redis
  ansible.builtin.apt:
    name: "{{ rspamd_packages }}"
    state: present

- name: Enable and start Redis
  ansible.builtin.service:
    name: redis-server
    state: started
    enabled: true

- name: Deploy Rspamd worker-controller configuration
  ansible.builtin.template:
    src: worker-controller.inc.j2
    dest: /etc/rspamd/local.d/worker-controller.inc
    owner: root
    group: _rspamd
    mode: "0640"
  notify: Reload rspamd
  no_log: true

- name: Deploy Rspamd local configuration
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/rspamd/local.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ rspamd_local_d_files }}"
  notify: Reload rspamd

- name: Create DKIM key directory
  ansible.builtin.file:
    path: "{{ rspamd_dkim_dir }}"
    state: directory
    owner: _rspamd
    group: _rspamd
    mode: "0750"

- name: Remove DKIM key when recreation is requested
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ rspamd_dkim_dir }}/{{ rspamd_dkim_selector }}.key"
    - "{{ rspamd_dkim_dir }}/{{ rspamd_dkim_selector }}.txt"
  when: rspamd_recreate_dkim_key | bool

- name: Generate DKIM signing key
  ansible.builtin.command:
    argv:
      - rspamadm
      - dkim_keygen
      - -b
      - "{{ rspamd_dkim_key_bits }}"
      - -s
      - "{{ rspamd_dkim_selector }}"
      - -k
      - "{{ rspamd_dkim_dir }}/{{ rspamd_dkim_selector }}.key"
    creates: "{{ rspamd_dkim_dir }}/{{ rspamd_dkim_selector }}.key"
  register: rspamd_dkim_keygen

- name: Store DKIM public key
  ansible.builtin.copy:
    dest: "{{ rspamd_dkim_dir }}/{{ rspamd_dkim_selector }}.txt"
    content: "{{ rspamd_dkim_keygen.stdout }}\n"
    owner: _rspamd
    group: _rspamd
    mode: "0440"
  when: rspamd_dkim_keygen is changed

- name: Restrict DKIM private key permissions
  ansible.builtin.file:
    path: "{{ rspamd_dkim_dir }}/{{ rspamd_dkim_selector }}.key"
    owner: _rspamd
    group: _rspamd
    mode: "0440"

- name: Display DKIM DNS record
  ansible.builtin.debug:
    msg: "{{ rspamd_dkim_keygen.stdout }}"
  when: rspamd_dkim_keygen is changed

- name: Restrict DKIM key directory permissions
  ansible.builtin.file:
    path: "{{ rspamd_dkim_dir }}"
    state: directory
    owner: _rspamd
    group: _rspamd
    recurse: true
    mode: u=rX,g=rX,o=

- name: Deploy restricted Rspamd local configuration
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/rspamd/local.d/{{ item }}"
    owner: _rspamd
    group: _rspamd
    mode: "0440"
  loop: "{{ rspamd_local_d_restricted_templates }}"
  notify: Reload rspamd

- name: Enable and start Rspamd
  ansible.builtin.service:
    name: rspamd
    state: started
    enabled: true
