---
- name: Install Postfix packages
  ansible.builtin.apt:
    name: "{{ mail_postfix_packages }}"
    state: present

- name: Remove default SASL configuration directory
  ansible.builtin.file:
    path: /etc/postfix/sasl
    state: absent

- name: Deploy main.cf
  ansible.builtin.template:
    src: main.cf.j2
    dest: /etc/postfix/main.cf
    owner: root
    group: root
    mode: "0644"
  notify: Reload postfix

- name: Deploy master.cf
  ansible.builtin.copy:
    src: master.cf
    dest: /etc/postfix/master.cf
    owner: root
    group: root
    mode: "0644"
  notify: Reload postfix

- name: Create Postfix SQL map directory
  ansible.builtin.file:
    path: /etc/postfix/sql
    state: directory
    owner: root
    group: postfix
    mode: "0750"

- name: Deploy Postfix SQL maps
  ansible.builtin.template:
    src: sql-map.cf.j2
    dest: "/etc/postfix/sql/{{ item.name }}.cf"
    owner: root
    group: postfix
    mode: "0640"
  loop: "{{ mail_postfix_sql_maps }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload postfix
  no_log: true

- name: Deploy postscreen access list
  ansible.builtin.copy:
    src: postscreen_access
    dest: /etc/postfix/postscreen_access
    owner: root
    group: root
    mode: "0644"
  notify: Reload postfix

- name: Deploy without_ptr map
  ansible.builtin.copy:
    src: without_ptr
    dest: /etc/postfix/without_ptr
    owner: root
    group: root
    mode: "0644"
  notify:
    - Rebuild postfix without_ptr map
    - Reload postfix

- name: Ensure without_ptr hash map exists
  ansible.builtin.command:
    argv:
      - postmap
      - /etc/postfix/without_ptr
    creates: /etc/postfix/without_ptr.db
  environment:
    PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

- name: Deploy submission header cleanup map
  ansible.builtin.copy:
    src: submission_header_cleanup
    dest: /etc/postfix/submission_header_cleanup
    owner: root
    group: root
    mode: "0644"
  notify: Reload postfix

- name: Check Postfix configuration
  ansible.builtin.command:
    argv:
      - postfix
      - check
  environment:
    PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  changed_when: false

- name: Enable and start Postfix
  ansible.builtin.service:
    name: postfix
    state: started
    enabled: true
