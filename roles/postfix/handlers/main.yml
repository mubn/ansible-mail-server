---
- name: Rebuild postfix without_ptr map
  ansible.builtin.command:
    argv:
      - postmap
      - /etc/postfix/without_ptr
  environment:
    PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  changed_when: true

- name: Reload postfix
  ansible.builtin.service:
    name: postfix
    state: reloaded
